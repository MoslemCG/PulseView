name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend and run model tests
        run: |
          npm run check:publication
          npm run check
          npm test
          node scripts/sync-version.mjs --check
          node scripts/sync-metrics.mjs
          git diff --exit-code -- native/MetricDefinitions.h
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          if($env:RELEASE_TAG -cne "v$version"){throw 'Release tag must match package.json version.'}
      - name: Configure Windows x64
        run: cmake --preset windows-x64
      - name: Build native host
        run: cmake --build --preset release --parallel
      - name: Native unit tests
        run: ctest --preset windows-release
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Ensure installer compiler
        shell: pwsh
        run: |
          if(-not(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")){
            choco install innosetup --version=6.4.3 --yes --no-progress
            if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed.'}
          }
      - name: Build Setup and checksums
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PulseView-Windows-x64
          path: |
            out/PulseView-Portable-x64.zip
            out/PulseView-Setup-x64.exe
            out/SHA256SUMS.txt
          if-no-files-found: error
  installer-smoke:
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PulseView-Windows-x64
          path: out
      - name: Test install, version and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, installer-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PulseView-Windows-x64
          path: out/release
      - name: Publish downloadable Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" out/release/PulseView-Setup-x64.exe out/release/PulseView-Portable-x64.zip out/release/SHA256SUMS.txt --verify-tag --title "PulseView $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
# Compiles and unit-tests. Does not certify GPU counter availability or overlay
# hit-testing/opacity on actual displays. Follow docs/WINDOWS_ACCEPTANCE.md.
